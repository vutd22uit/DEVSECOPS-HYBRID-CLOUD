# ================================================================= #
# SERVER CONFIGURATION
# ================================================================= #
server.port=8082
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,text/plain,text/css,application/javascript,text/html
server.forward-headers-strategy=framework

# ================================================================= #
# ACTUATOR / HEALTH / METRICS (Cho Kubernetes Liveness/Readiness)
# ================================================================= #
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Disable mail health check - không cần thiết cho demo
management.health.mail.enabled=false

# ================================================================= #
# LOGGING & OTHERS
# ================================================================= #
logging.file.name=
spring.main.banner-mode=off

# ================================================================= #
# CORS CONFIGURATION
# Ưu tiên lấy từ ConfigMap FRONTEND_URL để cho phép web truy cập API
# ================================================================= #
app.cors.allowed-origins=${FRONTEND_URL:*} 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ================================================================= #
# DATABASE - AWS RDS (USERS SERVICE)
# Khớp hoàn toàn với Terraform: db_name="foodhub_users", role="user_users"
# ================================================================= #
# 1. URL kết nối (Lấy từ global-cm.yaml)
spring.datasource.url=${DB_URL_USERS:jdbc:postgresql://localhost:5432/foodhub_users}

# 2. Username (Lấy từ users-values.yaml)
spring.datasource.username=${DB_USER_USERS:foodhub_admin}

# 3. Password (Lấy từ Secret: foodhub-secrets -> key: DB_PASSWORD_USERS)
spring.datasource.password=${DB_PASSWORD_USERS:FoodHub12345}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================================================================= #
# CẤU HÌNH SPRING MAIL (Disabled for demo)
# ================================================================= #
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:demo@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:disabled}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ================================================================= #
# CẤU HÌNH NGHIỆP VỤ & JWT
# ================================================================= #
app.otp.expiration-minutes=3
app.frontend.url=${FRONTEND_URL:http://localhost:3000} 
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# INFO / BUILD METADATA
management.info.env.enabled=true
info.app.name=users-service
info.app.version=1.0.0

# ================================================================= #
# GOOGLE OAUTH2 CONFIGURATION
# ================================================================= #
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, email, profile
app.oauth.google.redirect-uri=${FRONTEND_URL:http://localhost:3000}/callback