# FoodHub Service Account and RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foodhub-sa
  labels:
    app: foodhub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foodhub-role
  labels:
    app: foodhub
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foodhub-rolebinding
  labels:
    app: foodhub
subjects:
  - kind: ServiceAccount
    name: foodhub-sa
roleRef:
  kind: Role
  name: foodhub-role
  apiGroup: rbac.authorization.k8s.io
