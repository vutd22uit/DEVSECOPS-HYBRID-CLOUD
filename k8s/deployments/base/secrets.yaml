# Secrets template - Replace placeholders before applying
# For production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: foodhub-secrets
  labels:
    app: foodhub
type: Opaque
stringData:
  # JWT Secret for authentication
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET_256_BITS"
  
  # Mail server credentials (optional)
  mail-username: "foodhub@example.com"
  mail-password: "REPLACE_WITH_MAIL_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app: foodhub
type: Opaque
stringData:
  # Users service database
  users-jdbc-url: "jdbc:postgresql://postgresql:5432/foodhub_users"
  users-username: "users_svc"
  users-password: "REPLACE_WITH_USERS_DB_PASSWORD"
  
  # Products service database
  products-jdbc-url: "jdbc:postgresql://postgresql:5432/foodhub_products"
  products-username: "products_svc"
  products-password: "REPLACE_WITH_PRODUCTS_DB_PASSWORD"
  
  # Orders service database
  orders-jdbc-url: "jdbc:postgresql://postgresql:5432/foodhub_orders"
  orders-username: "orders_svc"
  orders-password: "REPLACE_WITH_ORDERS_DB_PASSWORD"

---
# Image pull secret for private registries
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  labels:
    app: foodhub
type: kubernetes.io/dockerconfigjson
data:
  # Replace with base64 encoded docker config
  # echo '{"auths":{"ghcr.io":{"auth":"BASE64_USERNAME:TOKEN"}}}' | base64
  .dockerconfigjson: e30=
