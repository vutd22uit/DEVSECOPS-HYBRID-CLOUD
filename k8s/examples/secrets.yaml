---
# Database Credentials for Users Service
apiVersion: v1
kind: Secret
metadata:
  name: users-db-credentials
  namespace: foodhub
type: Opaque
data:
  DB_USERNAME: Zm9vZGh1Yg==       # foodhub
  DB_PASSWORD: Rm9vZEh1YkAyMDI1  # FoodHub@2025
  
