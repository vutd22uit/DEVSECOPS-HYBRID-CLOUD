# ================================================================= #
# Kubernetes Deployment Manifest for Products Service
# Cloud Provider: AWS EKS
# ================================================================= #

apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: foodhub
  labels:
    app: products
    cloud: aws
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
        cloud: aws
        tier: backend
    spec:
      containers:
      - name: products
        image: 257394468168.dkr.ecr.ap-southeast-1.amazonaws.com/foodhub-products:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: DB_HOST
          value: "products-db.foodhub.svc.cluster.local"
        envFrom:
        - secretRef:
            name: products-db-credentials
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: foodhub
  labels:
    app: products
    cloud: aws
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: products
