# ================================================================= #
# Kubernetes Deployment Manifest for Orders Service
# Cloud Provider: OpenStack
# ================================================================= #

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: foodhub
  labels:
    app: orders
    cloud: openstack
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        cloud: openstack
        tier: backend
    spec:
      containers:
      - name: orders
        image: harbor.example.com/foodhub/foodhub-orders:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: DB_HOST
          value: "orders-db.foodhub.svc.cluster.local"
        envFrom:
        - secretRef:
            name: orders-db-credentials
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 5
      imagePullSecrets:
      - name: harbor-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: foodhub
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
  selector:
    app: orders
