# ================================================================= #
# Kubernetes Deployment Manifest for Frontend Service
# Cloud Provider: OpenStack
# ================================================================= #

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: foodhub
  labels:
    app: frontend
    cloud: openstack
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        cloud: openstack
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: harbor.example.com/foodhub/foodhub-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.foodhub.openstack.example.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
      imagePullSecrets:
      - name: harbor-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: foodhub
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: foodhub
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: foodhub.openstack.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
