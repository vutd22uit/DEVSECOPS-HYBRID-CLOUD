apiVersion: v1
kind: Secret
metadata:
  name: foodhub-openstack-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: foodhub-openstack
  server: https://REPLACE_WITH_OPENSTACK_K8S_API_ENDPOINT:6443
  config: |
    {
      "bearerToken": "REPLACE_WITH_SERVICE_ACCOUNT_TOKEN",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "REPLACE_WITH_BASE64_CA_CERT"
      }
    }
---
# ServiceAccount for ArgoCD in OpenStack Kubernetes
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
# ClusterRole for ArgoCD
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-manager-role
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
  - nonResourceURLs:
      - '*'
    verbs:
      - '*'
---
# ClusterRoleBinding for ArgoCD
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-manager-role
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
---
# Instructions ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-k8s-config
  namespace: argocd
data:
  instructions: |
    To configure OpenStack Kubernetes access for ArgoCD:

    1. Apply the ServiceAccount, ClusterRole, and ClusterRoleBinding above
       on the OpenStack Kubernetes cluster

    2. Create a long-lived token for the ServiceAccount:
       kubectl apply -f - <<EOF
       apiVersion: v1
       kind: Secret
       metadata:
         name: argocd-manager-token
         namespace: kube-system
         annotations:
           kubernetes.io/service-account.name: argocd-manager
       type: kubernetes.io/service-account-token
       EOF

    3. Get the token:
       kubectl get secret argocd-manager-token -n kube-system \
         -o jsonpath='{.data.token}' | base64 -d

    4. Get the CA certificate:
       kubectl get secret argocd-manager-token -n kube-system \
         -o jsonpath='{.data.ca\.crt}'

    5. Get the API server endpoint (from Terraform output or):
       kubectl cluster-info | grep 'Kubernetes control plane'

    6. Update the Secret above with correct values

    7. Apply this secret to ArgoCD namespace:
       kubectl apply -f cluster-openstack-k8s.yaml -n argocd
