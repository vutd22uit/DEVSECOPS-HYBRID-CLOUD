# Jenkins Configuration as Code (JCasC)
# This file configures Jenkins automatically on first boot
# Place this file in /var/jenkins_home/casc_configs/ directory

jenkins:
  systemMessage: "🚀 FoodHub DevSecOps Hybrid Cloud CI/CD Pipeline - Ready!"
  numExecutors: 4
  mode: NORMAL
  scmCheckoutRetryCount: 3
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
          
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:admin"
        - "Overall/Read:authenticated"

  globalNodeProperties:
    - envVars:
        env:
          - key: "AWS_REGION"
            value: "ap-southeast-1"
          - key: "AWS_ACCOUNT_ID"
            value: "257394468168"
          - key: "DEPLOYMENT_MODE"
            value: "HYBRID"

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "admin@foodhub.local"
    
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube-local"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
        
  globalLibraries:
    libraries:
      - name: "foodhub-shared-library"
        defaultVersion: "main"
        implicit: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/vutd22uit/DEVSECOPS-HYBRID-CLOUD.git"
                credentialsId: "github-pat"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube Authentication Token"
          - string:
              scope: GLOBAL
              id: "github-pat"
              secret: "${GITOPS_TOKEN}"
              description: "GitHub Personal Access Token"
          - string:
              scope: GLOBAL
              id: "harbor-registry-url"
              secret: "${HARBOR_REGISTRY_URL}"
              description: "Harbor Registry URL"
          - usernamePassword:
              scope: GLOBAL
              id: "harbor-credentials"
              username: "${HARBOR_USERNAME}"
              password: "${HARBOR_PASSWORD}"
              description: "Harbor Registry Credentials"
          - usernamePassword:
              scope: GLOBAL
              id: "aws-credentials"
              username: "${AWS_ACCESS_KEY_ID}"
              password: "${AWS_SECRET_ACCESS_KEY}"
              description: "AWS Access Credentials"

jobs:
  - script: >
      pipelineJob('FoodHub-Hybrid-Pipeline') {
        description('🚀 Hybrid Cloud CI/CD Pipeline for FoodHub Microservices')
        
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/vutd22uit/DEVSECOPS-HYBRID-CLOUD.git')
                  credentials('github-pat')
                }
                branch('*/main')
              }
            }
            scriptPath('CICD/Jenkinsfile.hybrid-cloud')
          }
        }
        
        triggers {
          githubPush()
        }
        
        properties {
          buildDiscarder {
            strategy {
              logRotator {
                numToKeepStr('10')
              }
            }
          }
        }
      }
