# Jenkins Configuration as Code (JCasC)
# This file configures Jenkins automatically on first boot
# Place this file in /var/jenkins_home/casc_configs/ directory

jenkins:
  systemMessage: "🚀 FoodHub DevSecOps Hybrid Cloud CI/CD Pipeline - Ready!"
  numExecutors: 4
  mode: NORMAL
  scmCheckoutRetryCount: 3
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
          
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:admin"
        - "Overall/Read:authenticated"

  globalNodeProperties:
    - envVars:
        env:
          - key: "AWS_REGION"
            value: "ap-southeast-1"
          - key: "AWS_ACCOUNT_ID"
            value: "257394468168"
          - key: "DEPLOYMENT_MODE"
            value: "HYBRID"

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "admin@foodhub.local"
    
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube-local"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
        
  globalLibraries:
    libraries:
      - name: "foodhub-shared-library"
        defaultVersion: "main"
        implicit: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/vutd22uit/DEVSECOPS-HYBRID-CLOUD.git"
                credentialsId: "github-pat"

